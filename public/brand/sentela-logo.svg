<svg width="820" height="200" viewBox="0 0 820 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sentela-logo-title sentela-logo-desc">
  <title id="sentela-logo-title">Sentela logo</title>
  <desc id="sentela-logo-desc">A shield-shaped monitoring beacon with a pulse line and the Sentela wordmark.</desc>
  <defs>
    <linearGradient id="sentela-logo-blue" x1="44" y1="30" x2="162" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8ED7FF"/>
      <stop offset="0.5" stop-color="#33A1FF"/>
      <stop offset="1" stop-color="#1668E1"/>
    </linearGradient>
    <linearGradient id="sentela-logo-pulse" x1="58" y1="112" x2="148" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#59BFFF"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="sentela-logo-glow" x="22" y="11" width="166" height="178" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.2 0 0 0 0 0.63 0 0 0 0 1 0 0 0 0.22 0"/>
      <feBlend in2="BackgroundImageFix" mode="screen" result="glow"/>
      <feBlend in="SourceGraphic" in2="glow" mode="normal"/>
    </filter>
  </defs>
  <g filter="url(#sentela-logo-glow)">
    <rect x="24" y="22" width="156" height="156" rx="38" fill="#0E1626"/>
    <rect x="25" y="23" width="154" height="154" rx="37" stroke="#59BFFF" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M102 45L154 66.5V101.5C154 132.5 134.3 157.3 102 173C69.7 157.3 50 132.5 50 101.5V66.5L102 45Z" fill="#0A0F1A" stroke="url(#sentela-logo-blue)" stroke-width="8.5" stroke-linejoin="round"/>
    <path d="M72.5 80.5C64.7 89.4 64.7 102.1 72.5 111" stroke="#59BFFF" stroke-width="7.5" stroke-linecap="round"/>
    <path d="M131.5 80.5C139.3 89.4 139.3 102.1 131.5 111" stroke="#59BFFF" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="102" cy="87" r="9.5" fill="#34D399"/>
    <path d="M60 116H82.5L91 94L107.5 146L123.5 70L137.5 124L146 116" stroke="url(#sentela-logo-pulse)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="146" cy="116" r="10.5" fill="#0E1626" stroke="#34D399" stroke-width="7"/>
  </g>
  <text x="218" y="123" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="760" letter-spacing="0">Sent</text>
  <text x="385" y="123" fill="#59BFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="760" letter-spacing="0">ela</text>
</svg>
