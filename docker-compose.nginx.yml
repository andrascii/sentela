# Отдельный HTTPS-слой: nginx терминирует TLS своим сертификатом и проксирует
# на приложение (порт 3000 на хосте). Запуск НА СЕРВЕРЕ, отдельно от основного стека:
#
#   docker compose -f docker-compose.nginx.yml up -d
#
# Перед запуском положи сертификат и ключ:
#   /etc/monkeyisland/ssl/sentela.org/fullchain.pem
#   /etc/monkeyisland/ssl/sentela.org/privatekey.pem
#
# network_mode: host → nginx слушает 80/443 на хосте и ходит на 127.0.0.1:3000
# (порт, который публикует контейнер app). 80/443 должны быть свободны (haproxy,
# caddy и т.п. — остановить или увести с этих портов).
#
# Серверные особенности конфига (доп. location'ы, соседние server-блоки) кладутся
# на хосте в /etc/sentela/nginx.d (*.locations / *.server) — деплой их не трогает.
# Изменил drop-in — перечитай конфиг: docker exec sentela-nginx nginx -s reload
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: sentela-nginx
    network_mode: host
    volumes:
      - ./nginx/sentela.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/sentela/nginx.d:/etc/nginx/sentela.d:ro
      - /etc/monkeyisland/ssl:/etc/monkeyisland/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Статика для drop-in server-блоков (сайт-маскарад и т.п.)
      - /var/www/html:/var/www/html:ro
    restart: unless-stopped
