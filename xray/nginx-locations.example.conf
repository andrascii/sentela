# ── Xray (VPN) маскировка под WSS к sentela.org ─────────────────────────────
# Вставь эти location-блоки ВНУТРЬ  server { listen 443 ssl; ... }  в
# nginx/sentela.conf, ВЫШЕ блока "location /". Каждый блок — отдельный клиент:
# секретный ws-путь → локальный Xray-инбаунд. TLS уже терминирован nginx, поэтому
# Xray слушает обычный ws на 127.0.0.1.
#
# Требуется директива (она уже есть в sentela.conf):
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#
# ВАЖНО: пути ниже — пример. Сгенерируй свои и держи реальный конфиг вне git:
#   путь:  openssl rand -hex 12     UUID: uuidgen
# Путь = секрет: чем длиннее и случайнее, тем лучше маскировка.

location /63625fea1e22094cb679b295 {        # клиент 1 → Xray :10001
    proxy_pass http://127.0.0.1:10001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_read_timeout 3600s;               # соединение долгоживущее
}

location /39c526865ac964852bd00b1c {        # клиент 2 → Xray :10002
    proxy_pass http://127.0.0.1:10002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_read_timeout 3600s;
}
