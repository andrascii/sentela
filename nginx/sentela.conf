# nginx reverse proxy для Sentela: TLS-терминация + проксирование на app:3000.
# Сертификат/ключ монтируются с хоста (см. docker-compose.nginx.yml).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sentela.org www.sentela.org;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sentela.org www.sentela.org;

    ssl_certificate     /etc/monkeyisland/ssl/sentela.org/fullchain.pem;
    ssl_certificate_key /etc/monkeyisland/ssl/sentela.org/privatekey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Размер тела (конфиг API-мониторов и т.п.)
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
